<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#182236"/>
      <stop offset="60%" stop-color="#0E131E"/>
      <stop offset="100%" stop-color="#08090C"/>
    </radialGradient>

    <!-- Buy (Electric Blue) Gradient -->
    <linearGradient id="buyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38A2FF"/>
      <stop offset="50%" stop-color="#0084FF"/>
      <stop offset="100%" stop-color="#0052CC"/>
    </linearGradient>

    <!-- Sell (Liquid Gold) Gradient -->
    <linearGradient id="sellGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFF6D1"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0084FF" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FFD700" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGlow)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6"/>

  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="190" stroke="rgba(255, 255, 255, 0.04)" stroke-width="4" stroke-dasharray="8 8"/>

  <g filter="url(#glowEffect)">
    <!-- Buying Arc with Arrowhead (Upper-Left to Center) -->
    <path d="M 160 256 C 160 180, 220 125, 305 125 C 360 125, 395 155, 410 195" 
          stroke="url(#buyGradient)" stroke-width="26" stroke-linecap="round" fill="none"/>
    <polygon points="410,165 428,206 384,204" fill="url(#buyGradient)"/>

    <!-- Selling Arc with Arrowhead (Lower-Right to Center) -->
    <path d="M 352 256 C 352 332, 292 387, 207 387 C 152 387, 117 357, 102 317" 
          stroke="url(#sellGradient)" stroke-width="26" stroke-linecap="round" fill="none"/>
    <polygon points="102,347 84,306 128,308" fill="url(#sellGradient)"/>

    <!-- Center "&" Emblem in Modern Bold Typographic Style -->
    <text x="256" y="296" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="148" 
          font-weight="900" 
          fill="#FFFFFF" 
          text-anchor="middle"
          letter-spacing="-4">
      &amp;
    </text>

    <!-- Electric & Gold Spark Dots -->
    <circle cx="370" cy="140" r="8" fill="#38A2FF"/>
    <circle cx="142" cy="372" r="8" fill="#FFD700"/>
  </g>
</svg>
